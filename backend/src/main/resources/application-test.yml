spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cache:
    type: none
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test
            client-secret: test

app:
  jwt:
    secret: test_secret_key_for_testing_1234567890
    expiration: 86400000
  stripe:
    secret-key: sk_test_test
    webhook-secret: whsec_test
  base-url: http://localhost:8080

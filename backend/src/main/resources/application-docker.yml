spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:sushi_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "${APP_BASE_URL}/login/oauth2/code/google"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  seed-demo-users: ${SEED_DEMO_USERS:false}

logging:
  level:
    com.sushishop: INFO
    org.springframework.cache: WARN
    org.springframework.data.redis: WARN

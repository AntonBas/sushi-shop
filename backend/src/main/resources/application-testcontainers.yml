spring:
  config:
    activate:
      on-profile: testcontainers
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: none
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test
            client-secret: test

app:

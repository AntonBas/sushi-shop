services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: sushi-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: 'redis:7-alpine'
    container_name: sushi_redis
    ports:
      - '${REDIS_PORT}:6379'

volumes:
  postgres_data: